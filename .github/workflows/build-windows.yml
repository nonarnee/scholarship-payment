name: build-windows
# 합성 데이터만 사용한다. 실제 업무 파일은 저장소에도 CI에도 올리지 않는다.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"        # 러너 콘솔(cp1252)에서 한글 출력이 깨지지 않도록
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]" pyinstaller==6.11.1
      - name: Public safety check
        run: python tools/safety/check_public_safety.py --tracked
      - name: Tests
        run: python -m pytest -q tests
      - name: Synthetic end-to-end smoke
        run: python packaging/ci_smoke.py
      - name: Tk available
        run: python -c "import tkinter; r = tkinter.Tk(); r.destroy(); print('tk ok')"
      - name: Build app folder (onedir)
        id: build
        shell: bash
        run: |
          v=$(python -c "import scholarship_payment as s; print(s.__version__)")
          n="ScholarshipPayment-v${v}"
          python packaging/make_version_info.py version_info.txt
          pyinstaller --noconfirm --onedir --windowed --name "$n" \
            --version-file version_info.txt \
            --paths src --collect-submodules msoffcrypto \
            packaging/run_gui.py
          (cd "dist/$n" && sha256sum "$n.exe" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "name=${n}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "dir=dist/$n" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ steps.build.outputs.dir }}
          if-no-files-found: error

  # 신규 PySide6 화면(Phase 1) 확인용. 위 build 작업과 독립이며 배포 산출물에는 영향이 없다.
  # 합격 기준은 두지 않는다: 폴더 크기와 smoke 실행 시간은 기록만 한다.
  ui-foundation:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen      # 러너에는 화면이 없으므로 offscreen 으로 그린다(DPI·실제 외관은 수동 확인)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,gui]" pyinstaller==6.11.1
      - name: UI tests
        run: python -m pytest -q tests/ui
      - name: Dev entry smoke (python)
        run: python -m scholarship_payment.ui --smoke
      - name: Build PySide6 folder (onedir)
        run: >
          pyinstaller --noconfirm --onedir --windowed --name ScholarshipPaymentUI-dev
          --paths src --exclude-module PySide6.QtNetwork
          packaging/run_ui_dev.py
      - name: Smoke the built exe and record size/time
        shell: pwsh
        run: |
          $dir = "dist/ScholarshipPaymentUI-dev"
          $mb = [math]::Round(((Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 1)
          $t = Measure-Command { $p = Start-Process -FilePath "$dir/ScholarshipPaymentUI-dev.exe" -ArgumentList "--smoke" -Wait -PassThru }
          $line = "PySide6 onedir: $mb MB, smoke exit code $($p.ExitCode), smoke time $([math]::Round($t.TotalSeconds,2)) s (offscreen, CI runner)"
          Write-Output $line
          Add-Content $env:GITHUB_STEP_SUMMARY $line
          if ($p.ExitCode -ne 0) { exit 1 }
      # 패키징된 exe 가 합성 입력으로 Step 1→2→3 생성 경로를 끝까지 실행하는지 확인한다(실제 자료·업무 로직 변경 없음).
      # 확인 범위: 모듈 로딩·합성 Excel 파싱·정책/템플릿 로딩·미리보기·XLSX 생성과 출력 재검증·무덮어쓰기·암호 파일·폴더 오류 재시도.
      # 확인하지 않는 범위: 실제 창·글꼴·DPI, 파일 선택 대화상자, 드래그 앤 드롭, 폴더 열기·클립보드, 실제 Excel 에서 열기.
      - name: Prepare synthetic E2E inputs
        run: python tools/ci/prepare_e2e_inputs.py "$env:RUNNER_TEMP/e2e"
      - name: Synthetic E2E in the packaged exe (parse, preview, generate)
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "e2e"
          $res = Join-Path $work "result.json"
          $dir = "dist/ScholarshipPaymentUI-dev"
          $t = Measure-Command { $p = Start-Process -FilePath "$dir/ScholarshipPaymentUI-dev.exe" -ArgumentList @("--synthetic-e2e-smoke", "--work-dir", $work, "--result-json", $res) -Wait -PassThru }
          $line = "Packaged exe synthetic E2E: exit code $($p.ExitCode), time $([math]::Round($t.TotalSeconds,2)) s (offscreen, CI runner)"
          Write-Output $line
          Add-Content $env:GITHUB_STEP_SUMMARY $line
          if (Test-Path $res) { Get-Content $res -Encoding UTF8 | Write-Output }
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Verify E2E outputs outside the exe (golden, no-overwrite, temp-file cleanup)
        run: python tools/ci/verify_e2e_outputs.py "$env:RUNNER_TEMP/e2e" "$env:RUNNER_TEMP/e2e/result.json" --require-frozen
      - uses: actions/upload-artifact@v4
        with:
          name: ScholarshipPaymentUI-e2e-synthetic-outputs-${{ github.sha }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ScholarshipPaymentUI-dev-${{ github.sha }}
          path: dist/ScholarshipPaymentUI-dev
          if-no-files-found: error
