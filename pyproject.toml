[project]
name = "scholarship-payment"
dynamic = ["version"]
description = "한국장학재단 월별지급승인 엑셀을 대학 표준 지급명단으로 변환하는 오프라인 도구 (개발 중)"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1", "msoffcrypto-tool>=5.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# 신규 화면(PySide6, 개발 중). 필수 의존성이 아니며 기존 Tkinter 화면·명령줄에는 필요 없다. LGPL-3.0 (docs/UI-FRAMEWORK.md)
gui = ["PySide6-Essentials>=6.8,<7"]

[tool.setuptools.dynamic]
version = {attr = "scholarship_payment.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
